[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viparse-langchain"
version = "0.1.0"
description = "LangChain integration for viparse — read Vietnamese documents, legacy encodings included"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Đinh Minh Trí", email = "hello@trizenx.com" }]
keywords = ["langchain", "vietnamese", "tcvn3", "vni", "rag", "document loader", "unicode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Vietnamese",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["viparse[langchain]>=0.1.29"]

[project.urls]
Homepage = "https://viparse.trizenx.com"
Source = "https://github.com/TrizenX/viparse/tree/main/packages/viparse-langchain"
Changelog = "https://github.com/TrizenX/viparse/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/viparse_langchain"]
