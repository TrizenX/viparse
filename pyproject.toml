[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viparse"
dynamic = ["version"]
description = "Vietnamese-first document loader for RAG"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Đinh Minh Trí (Kayden)", email = "hello@trizenx.com" }]
keywords = ["vietnamese", "rag", "document", "parser", "tcvn3", "vni", "nfc"]
# Trove classifiers are what PyPI's sidebar and shields.io's pyversions badge read
# — neither looks at requires-python — so with none declared the badge renders
# "missing". No License:: classifier: `license = "MIT"` above is the PEP 639
# expression, and declaring both is an error.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Vietnamese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

# Heavy engines live behind extras so the default (`core`) install stays light —
# `pip install viparse` pulls no parser/OCR binaries. `all` is the union of them.
[project.optional-dependencies]
office = ["python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1,<2", "olefile>=0.47,<1"]
pdf = ["pdfplumber>=0.11,<0.12"]
rtf = ["striprtf>=0.0.29,<0.1"]
ocr = ["pytesseract>=0.3,<0.4", "pdf2image>=1.17,<2", "pillow>=10,<13"]
langchain = ["langchain-core>=0.3,<2"]
llamaindex = ["llama-index-core>=0.11,<1"]
# Not in `all`: `all` is for parsing capability, and the MCP server is a delivery
# surface. Installing every format handler should not start pulling in a server runtime.
mcp = ["mcp>=2,<3"]
all = ["viparse[office,pdf,rtf,ocr,langchain,llamaindex]"]
# The two gatekeepers are capped to a single minor series on purpose. Both decide whether CI
# passes, so a new release lands as a red build on whatever unrelated PR is open at the time:
# ruff 0.16 began formatting Python blocks inside Markdown and turned `quality` red until
# README.md was reflowed. For a linter and a type checker the breaking unit is the *minor*
# release, not the major — hence a tighter cap than the runtime extras above. Dependabot
# raises these weekly, so the upgrade and the fixes it needs land in one reviewed PR.
dev = [
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    "pytest",
    "pytest-cov",
    "build",
    "reportlab>=4,<6",
    "cyclonedx-bom",
]

[project.scripts]
viparse = "viparse.cli:main"
viparse-mcp = "viparse.mcp.server:main"

[project.urls]
Homepage = "https://viparse.trizenx.com"
Repository = "https://github.com/TrizenX/viparse"
Changelog = "https://github.com/TrizenX/viparse/blob/main/CHANGELOG.md"
Issues = "https://github.com/TrizenX/viparse/issues"

[tool.hatch.version]
path = "src/viparse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/viparse"]

# The distributions under packages/ are built from their own pyproject.toml and must not
# be swept into viparse's sdist, or `pip install viparse` would ship two copies of them.
[tool.hatch.build.targets.sdist]
exclude = ["packages/"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# These libraries ship no type stubs (unlike python-docx); the adapters treat them as Any.
[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "pdfplumber.*",
    "striprtf.*",
    "pytesseract.*",
    "pdf2image.*",
    "olefile.*",
    "langchain_core.*",
    "llama_index.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["viparse"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
